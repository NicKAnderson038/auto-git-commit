name: Auto-Merge and Delete Branch

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

jobs:
  auto-merge:
    runs-on: ubuntu-latest
    # Grant permissions to modify pull requests and contents
    permissions:
      pull-requests: write
      contents: write

    steps:
      - name: Enable Auto-Merge and Delete Branch
        run: gh pr merge "${{ github.event.pull_request.html_url }}" --auto --squash --delete-branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
