name: Auto Merge with Squash

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  auto-merge:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      contents: write

    steps:
      - name: Check if PR is from feature branch
        id: check-feature
        run: |
          HEAD_REF="${{ github.head_ref }}"

          if [[ "$HEAD_REF" =~ ^feature/ ]] || [[ "$HEAD_REF" =~ ^feat/ ]]; then
            echo "is_feature=true" >> "$GITHUB_OUTPUT"
            echo "Found feature branch: $HEAD_REF"
          else
            echo "is_feature=false" >> "$GITHUB_OUTPUT"
            echo "Branch $HEAD_REF does not match feature branch pattern"
          fi

      - name: Debug PR state
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          owner_repo="${GITHUB_REPOSITORY}"
          curl -s -H "Authorization: Bearer $GITHUB_TOKEN" \
               -H "Accept: application/vnd.github+json" \
               "https://api.github.com/repos/${owner_repo}/pulls/${PR_NUMBER}" | jq '.state, .mergeable, .draft'

      - name: Enable auto-merge (REST API)
        if: steps.check-feature.outputs.is_feature == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          echo "Attempting to enable auto-merge (squash) for PR #$PR_NUMBER"

          # Give GitHub API a moment to settle the PR
          sleep 2

          owner_repo="${GITHUB_REPOSITORY}"
          api_url="https://api.github.com/repos/${owner_repo}/pulls/${PR_NUMBER}/enable-auto-merge"
          payload='{"merge_method":"squash"}'

          res=$(curl -s -H "Authorization: Bearer $GITHUB_TOKEN" \
                       -H "Accept: application/vnd.github+json" \
                       -X PUT \
                       -d "$payload" \
                       "$api_url" -w "\n%{http_code}")
          http_code=$(echo "$res" | tail -n1)
          body=$(echo "$res" | sed '$d')

          if [[ "$http_code" =~ ^2 ]]; then
            echo "✓ Auto-merge enabled for PR #$PR_NUMBER"
          else
            echo "✗ Failed to enable auto-merge (HTTP $http_code)"
            echo "API response:"
            echo "$body"
          fi
